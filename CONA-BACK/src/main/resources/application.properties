spring.application.name=${APP_NAME:CONA-BACK}

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cona}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# API base path
server.servlet.context-path=${SERVER_CONTEXT_PATH:/cona-api}

# JWT
app.jwt.secret=${JWT_SECRET:change_me_with_a_long_random_secret_32b_min}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Seed (DataInitializer)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD}
app.seed.employee.email=${APP_SEED_EMPLOYEE_EMAIL}
app.seed.employee.password=${APP_SEED_EMPLOYEE_PASSWORD}

spring.application.name=${APP_NAME}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}

# API base path
server.servlet.context-path=${SERVER_CONTEXT_PATH}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Seed (DataInitializer)
app.seed.enabled=${APP_SEED_ENABLED}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD}
app.seed.employee.email=${APP_SEED_EMPLOYEE_EMAIL}
app.seed.employee.password=${APP_SEED_EMPLOYEE_PASSWORD}

# SMTP Configuration for Gmail
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.protocol=${SMTP_PROTOCOL}

# SMTP Properties
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST}
# Recomendadas para Gmail/Angus
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.protocols=${SMTP_SSL_PROTOCOLS:TLSv1.2 TLSv1.3}
spring.mail.properties.mail.smtp.auth.mechanisms=${SMTP_AUTH_MECHANISMS:LOGIN PLAIN}
spring.mail.properties.mail.smtp.quitwait=${SMTP_QUITWAIT:false}
# Si quieres verificar al arrancar que las credenciales conectan
spring.mail.test-connection=${SMTP_TEST_CONNECTION:false}

# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT}

# Debug
spring.mail.properties.mail.debug=${SMTP_DEBUG}